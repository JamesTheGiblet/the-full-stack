[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-core"
version = "0.1.0"
description = "Shared, pure Forge Stack protocol primitives: canonicalisation, UTC timestamps, SCP identifiers, Ed25519 signing."
requires-python = ">=3.9"
dependencies = ["cryptography"]

[tool.setuptools]
packages = ["forge_core"]
