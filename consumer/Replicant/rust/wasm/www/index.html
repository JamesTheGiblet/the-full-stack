<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 Replicant WASM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0B0E14; color: #CCCCCC; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; }
        .container { background: #141820; border-radius: 12px; padding: 20px; border: 1px solid #2A3040; box-shadow: 0 8px 32px rgba(0,0,0,0.8); }
        canvas { display: block; border-radius: 8px; background: #0B0E14; border: 1px solid #2A3040; cursor: pointer; width: 800px; height: 600px; }
        .controls { display: flex; gap: 12px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
        .controls button { background: #2A3040; color: #CCCCCC; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 14px; transition: all 0.2s; }
        .controls button:hover { background: #3A4050; }
        .controls button.primary { background: #50C850; color: #0B0E14; }
        .controls button.primary:hover { background: #60D860; }
        .controls button.danger { background: #C85050; color: #0B0E14; }
        .controls button.danger:hover { background: #D86060; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; width: 100%; }
        .stat { background: #1A2030; padding: 12px 16px; border-radius: 8px; text-align: center; border: 1px solid #2A3040; }
        .stat .label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat .value { font-size: 24px; font-weight: bold; margin-top: 4px; }
        .stat .value.green { color: #50C850; }
        .stat .value.yellow { color: #C8C850; }
        .stat .value.red { color: #C85050; }
        .stat .value.cyan { color: #50C8C8; }
        .telemetry-panel { margin-top: 12px; padding: 8px 16px; background: #1A2030; border-radius: 6px; font-size: 13px; color: #888; border: 1px solid #2A3040; width: 100%; text-align: center; }
        .telemetry-panel .highlight { color: #CCCCCC; }
        @media (max-width: 850px) { canvas { width: 100%; height: auto; } .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="replicant-canvas" width="800" height="600"></canvas>
        
        <div class="controls">
            <button class="primary" id="start-btn">▶ Start</button>
            <button id="pause-btn">⏸ Pause</button>
            <button id="step-btn">⏭ Step</button>
            <button class="danger" id="reset-btn">⟳ Reset</button>
            <button id="export-btn">📥 Export</button>
            <span style="margin-left: auto; font-size: 14px; color: #666;">🧬 Replicant WASM</span>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat"><div class="label">👥 Agents</div><div class="value green" id="stat-agents">0</div></div>
            <div class="stat"><div class="label">📋 Claims</div><div class="value yellow" id="stat-claims">0</div></div>
            <div class="stat"><div class="label">🔍 COUNTER</div><div class="value red" id="stat-counters">0</div></div>
            <div class="stat"><div class="label">🌿 Health</div><div class="value cyan" id="stat-health">0.000</div></div>
        </div>
        
        <div class="telemetry-panel" id="telemetry">
            <span class="highlight">📊 Telemetry (last 10 ticks):</span>
            <span id="telemetry-data">Waiting for data...</span>
        </div>
    </div>

    <script>
        import init, { ReplicantWASM } from './replicant.js';
        
        let replicantWASM = null;
        let running = false;
        let animationId = null;
        let telemetry = [];
        
        async function initialize() {
            await init();
            replicantWASM = new ReplicantWASM('replicant-canvas');
            updateStats();
            document.getElementById('telemetry-data').textContent = 'Ready';
        }
        
        function updateStats() {
            if (!replicantWASM) return;
            const stats = replicantWASM.get_stats();
            document.getElementById('stat-agents').textContent = stats.agents;
            document.getElementById('stat-claims').textContent = stats.claims;
            document.getElementById('stat-counters').textContent = stats.counters;
            document.getElementById('stat-health').textContent = stats.health.toFixed(3);
            document.getElementById('telemetry-data').textContent = 
                `Tick ${stats.tick} | Season: ${stats.season} | Agents: ${stats.agents}`;
        }
        
        function startLoop() {
            if (running) return;
            running = true;
            document.getElementById('start-btn').textContent = '⏹ Running';
            
            function loop() {
                if (!running) {
                    document.getElementById('start-btn').textContent = '▶ Start';
                    return;
                }
                if (replicantWASM) {
                    replicantWASM.step();
                    updateStats();
                }
                animationId = requestAnimationFrame(loop);
            }
            loop();
        }
        
        function stopLoop() {
            running = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            document.getElementById('start-btn').textContent = '▶ Start';
        }
        
        document.getElementById('start-btn').addEventListener('click', () => {
            if (running) stopLoop();
            else startLoop();
        });
        
        document.getElementById('pause-btn').addEventListener('click', () => {
            if (running) stopLoop();
            else startLoop();
        });
        
        document.getElementById('step-btn').addEventListener('click', () => {
            if (replicantWASM) {
                replicantWASM.step();
                updateStats();
            }
        });
        
        document.getElementById('reset-btn').addEventListener('click', () => {
            stopLoop();
            location.reload();
        });
        
        document.getElementById('export-btn').addEventListener('click', () => {
            if (replicantWASM && typeof replicantWASM.export_state === 'function') {
                try {
                    const data = replicantWASM.export_state();
                    const blob = new Blob([data], {type: 'application/json'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `replicant_state_${Date.now()}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    document.getElementById('telemetry-data').textContent = '✅ Exported!';
                } catch (e) {
                    document.getElementById('telemetry-data').textContent = `❌ Export failed: ${e}`;
                }
            }
        });
        
        initialize();
    </script>
</body>
</html>
