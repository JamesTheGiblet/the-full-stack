[package]
name = "replicant-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
replicant = { path = ".." }
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.39"
js-sys = "0.3.69"
web-sys = { version = "0.3.69", features = ["console", "Document", "Element", "Window", "CanvasRenderingContext2d", "HtmlCanvasElement"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.24.0", features = ["v4", "js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

