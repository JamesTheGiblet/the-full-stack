[package]
name = "replicant"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = { version = "0.8", features = ["std_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
rayon = "1.12"
ed25519-dalek = "3.0"
sha2 = "0.11"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "console"
] }

[features]
default = ["std"]
std = []

[dev-dependencies]
rand = "0.8"
serde_json = "1.0"

[lib]
crate-type = ["cdylib", "rlib"]
