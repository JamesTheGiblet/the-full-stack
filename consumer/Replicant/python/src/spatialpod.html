<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpatialPod - 3D Knowledge Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050508;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 3px solid #ff6b1a;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .controls button {
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,107,26,0.5);
            color: #ff6b1a;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            transition: all 0.2s;
        }
        .controls button:hover {
            background: rgba(255,107,26,0.2);
            border-color: #ff6b1a;
            color: #ff9a4a;
        }
        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 11px;
            text-align: right;
            z-index: 100;
            pointer-events: none;
            font-family: 'Share Tech Mono', monospace;
        }
        .mode-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,107,26,0.2);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            color: #ff6b1a;
            z-index: 100;
            pointer-events: none;
            font-family: 'Share Tech Mono', monospace;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="mode-indicator" id="modeIndicator">⚡ VIEW MODE</div>
    <div class="stats" id="stats">
        <div>📦 PODS: <span id="podsCount">0</span></div>
        <div>✨ PARTICLES: <span id="particlesCount">0</span></div>
        <div>⚡ ENERGY: <span id="energyLevel">100</span>%</div>
    </div>
    <div class="info-panel">
        🧠 SPATIAL KNOWLEDGE PODS | Drag to orbit | Scroll to zoom
    </div>
    <div class="controls">
        <button id="createBtn">✨ CREATE POD</button>
        <button id="editBtn">✏️ EDIT MODE</button>
        <button id="viewBtn">👁️ VIEW MODE</button>
        <button id="clearBtn">🗑️ CLEAR ALL</button>
    </div>

    <script src="/website/js/three.min.js"></script>
    <script>
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.003);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 8, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffaa66, 1);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0x4466cc, 0.5);
        fillLight.position.set(-3, 2, 4);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0xff6633, 0.4);
        backLight.position.set(0, 2, -5);
        scene.add(backLight);
        
        const ambientFill = new THREE.AmbientLight(0x331100);
        scene.add(ambientFill);
        
        // --- CENTER GLOW ---
        const centerGlowMat = new THREE.MeshStandardMaterial({ color: 0xff4411, emissive: 0x441100, emissiveIntensity: 0.4 });
        const coreGlow = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), centerGlowMat);
        scene.add(coreGlow);
        
        // --- HELPER GRID ---
        const gridHelper = new THREE.GridHelper(30, 20, 0xff4422, 0x335566);
        gridHelper.position.y = -2;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        scene.add(gridHelper);
        
        // --- STARFIELD PARTICLES ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 800;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 200;
            starPositions[i*3+1] = (Math.random() - 0.5) * 80;
            starPositions[i*3+2] = (Math.random() - 0.5) * 100 - 50;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.15, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // --- DATA STORAGE ---
        let pods = [];
        let floatingParticles = [];
        let mode = 'view'; // view, edit
        let selectedPod = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        
        // --- HELPER FUNCTIONS ---
        function updateStats() {
            document.getElementById('podsCount').innerText = pods.length;
            let particleCount = 0;
            floatingParticles.forEach(p => particleCount += p.particles ? p.particles.length : 0);
            document.getElementById('particlesCount').innerText = particleCount;
        }
        
        function updateModeDisplay() {
            const indicator = document.getElementById('modeIndicator');
            if (mode === 'view') {
                indicator.innerHTML = '👁️ VIEW MODE';
                indicator.style.color = '#4ecdc4';
                document.body.style.cursor = 'default';
            } else {
                indicator.innerHTML = '✏️ EDIT MODE - Click pod to select, drag to move';
                indicator.style.color = '#ff6b1a';
                document.body.style.cursor = 'pointer';
            }
        }
        
        // --- CREATE A KNOWLEDGE POD ---
        function createPod(x, z, colorHex = null, size = 0) {
            const hue = colorHex || (Math.random() * 0xffffff);
            const podGroup = new THREE.Group();
            
            // Main sphere
            const geometry = new THREE.SphereGeometry(size || 0.8, 32, 32);
            const material = new THREE.MeshStandardMaterial({ 
                color: hue, 
                emissive: 0x331100,
                emissiveIntensity: 0.3,
                metalness: 0.6,
                roughness: 0.3
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.castShadow = true;
            sphere.receiveShadow = false;
            podGroup.add(sphere);
            
            // Glow ring
            const ringGeo = new THREE.TorusGeometry(0.95, 0.05, 32, 64);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0xff6633, emissive: 0x442200 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            podGroup.add(ring);
            
            // Particle orbit
            const orbitParticles = [];
            const orbitCount = 12;
            for (let i = 0; i < orbitCount; i++) {
                const partGeo = new THREE.SphereGeometry(0.06, 8, 8);
                const partMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0x442200 });
                const particle = new THREE.Mesh(partGeo, partMat);
                const angle = (i / orbitCount) * Math.PI * 2;
                particle.userData = { angle, radius: 1.2, speed: 0.01 };
                podGroup.add(particle);
                orbitParticles.push(particle);
            }
            
            podGroup.position.set(x, 0, z);
            podGroup.userData = { type: 'pod', color: hue, orbitParticles, size: size || 0.8 };
            scene.add(podGroup);
            
            pods.push({ group: podGroup, x, z, color: hue, size: size || 0.8 });
            updateStats();
            return podGroup;
        }
        
        // --- CLEAR ALL PODS ---
        function clearAllPods() {
            pods.forEach(pod => {
                scene.remove(pod.group);
                // Clean up geometries
                pod.group.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                });
            });
            pods = [];
            floatingParticles.forEach(fp => {
                fp.particles.forEach(p => scene.remove(p));
            });
            floatingParticles = [];
            updateStats();
        }
        
        // --- CREATE FLOATING PARTICLES (knowledge particles) ---
        function addFloatingParticles(count = 30) {
            const particles = [];
            for (let i = 0; i < count; i++) {
                const particleGeo = new THREE.SphereGeometry(0.08, 8, 8);
                const particleMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x224466 });
                const particle = new THREE.Mesh(particleGeo, particleMat);
                particle.position.set(
                    (Math.random() - 0.5) * 12,
                    Math.random() * 6 - 2,
                    (Math.random() - 0.5) * 12
                );
                particle.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.02,
                        (Math.random() - 0.5) * 0.02,
                        (Math.random() - 0.5) * 0.02
                    )
                };
                scene.add(particle);
                particles.push(particle);
            }
            floatingParticles.push({ particles, age: 0 });
            updateStats();
        }
        
        // --- ANIMATION LOOP ---
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            // Rotate starfield slowly
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0003;
            
            // Animate pod ring particles
            pods.forEach(pod => {
                const orbitParticles = pod.group.userData.orbitParticles;
                if (orbitParticles) {
                    orbitParticles.forEach((part, idx) => {
                        const angle = time * 1.5 + (idx / orbitParticles.length) * Math.PI * 2;
                        const radius = 1.2;
                        part.position.x = Math.cos(angle) * radius;
                        part.position.z = Math.sin(angle) * radius;
                    });
                }
                // Gentle floating
                pod.group.position.y = Math.sin(time * 1.2 + pod.x) * 0.1;
            });
            
            // Animate floating particles
            floatingParticles.forEach(fp => {
                fp.particles.forEach(p => {
                    p.position.x += p.userData.velocity.x;
                    p.position.y += p.userData.velocity.y;
                    p.position.z += p.userData.velocity.z;
                    // Wrap around
                    if (Math.abs(p.position.x) > 15) p.userData.velocity.x *= -1;
                    if (Math.abs(p.position.y) > 8) p.userData.velocity.y *= -1;
                    if (Math.abs(p.position.z) > 15) p.userData.velocity.z *= -1;
                });
            });
            
            // Rotate core
            coreGlow.rotation.y += 0.01;
            
            renderer.render(scene, camera);
        }
        
        // --- INTERACTION ---
        function onMouseClick(event) {
            if (mode !== 'edit') return;
            
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pods.map(p => p.group), true);
            
            if (intersects.length > 0) {
                let clicked = intersects[0].object.parent;
                while (clicked && !pods.find(p => p.group === clicked)) clicked = clicked.parent;
                if (clicked && pods.find(p => p.group === clicked)) {
                    if (selectedPod) {
                        selectedPod.group.children.forEach(c => {
                            if (c.material) c.material.emissiveIntensity = 0.3;
                        });
                    }
                    selectedPod = pods.find(p => p.group === clicked);
                    selectedPod.group.children.forEach(c => {
                        if (c.material) c.material.emissiveIntensity = 0.8;
                    });
                }
            } else if (selectedPod) {
                selectedPod.group.children.forEach(c => {
                    if (c.material) c.material.emissiveIntensity = 0.3;
                });
                selectedPod = null;
            }
        }
        
        function onMouseMove(event) {
            if (mode !== 'edit' || !selectedPod) return;
            
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            
            const planeZ = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            raycaster.setFromCamera(mouse, camera);
            const point = raycaster.ray.intersectPlane(planeZ, new THREE.Vector3());
            if (point) {
                selectedPod.group.position.x = point.x;
                selectedPod.group.position.z = point.z;
                selectedPod.x = point.x;
                selectedPod.z = point.z;
            }
        }
        
        // --- ORBIT CONTROLS (simple) ---
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;
        let cameraTheta = Math.atan2(camera.position.z, camera.position.x);
        let cameraPhi = Math.asin(camera.position.y / Math.sqrt(camera.position.x**2 + camera.position.y**2 + camera.position.z**2));
        let cameraRadius = Math.sqrt(camera.position.x**2 + camera.position.y**2 + camera.position.z**2);
        
        function onMouseDown(event) {
            if (mode === 'edit' && selectedPod) return;
            isDragging = true;
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;
        }
        
        function onMouseMoveOrbit(event) {
            if (!isDragging || (mode === 'edit' && selectedPod)) return;
            const dx = event.clientX - lastMouseX;
            const dy = event.clientY - lastMouseY;
            cameraTheta += dx * 0.008;
            cameraPhi += dy * 0.008;
            cameraPhi = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, cameraPhi));
            camera.position.x = cameraRadius * Math.cos(cameraTheta) * Math.cos(cameraPhi);
            camera.position.z = cameraRadius * Math.sin(cameraTheta) * Math.cos(cameraPhi);
            camera.position.y = cameraRadius * Math.sin(cameraPhi);
            camera.lookAt(0, 0, 0);
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;
        }
        
        function onMouseUp() { isDragging = false; }
        
        renderer.domElement.addEventListener('click', onMouseClick);
        renderer.domElement.addEventListener('mousemove', onMouseMove);
        renderer.domElement.addEventListener('mousedown', onMouseDown);
        renderer.domElement.addEventListener('mousemove', onMouseMoveOrbit);
        renderer.domElement.addEventListener('mouseup', onMouseUp);
        
        // Scroll zoom
        renderer.domElement.addEventListener('wheel', (e) => {
            cameraRadius = Math.max(5, Math.min(30, cameraRadius + e.deltaY * 0.02));
            camera.position.x = cameraRadius * Math.cos(cameraTheta) * Math.cos(cameraPhi);
            camera.position.z = cameraRadius * Math.sin(cameraTheta) * Math.cos(cameraPhi);
            camera.position.y = cameraRadius * Math.sin(cameraPhi);
            camera.lookAt(0, 0, 0);
        });
        
        // --- UI BUTTONS ---
        document.getElementById('createBtn').addEventListener('click', () => {
            const x = (Math.random() - 0.5) * 10;
            const z = (Math.random() - 0.5) * 10;
            const colors = [0xff4433, 0x33ff99, 0x44aaff, 0xffaa33, 0xaa44ff];
            const color = colors[Math.floor(Math.random() * colors.length)];
            createPod(x, z, color, 0.6 + Math.random() * 0.5);
            addFloatingParticles(8);
        });
        
        document.getElementById('editBtn').addEventListener('click', () => {
            mode = 'edit';
            updateModeDisplay();
        });
        
        document.getElementById('viewBtn').addEventListener('click', () => {
            mode = 'view';
            if (selectedPod) {
                selectedPod.group.children.forEach(c => {
                    if (c.material) c.material.emissiveIntensity = 0.3;
                });
                selectedPod = null;
            }
            updateModeDisplay();
        });
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            clearAllPods();
            if (selectedPod) selectedPod = null;
        });
        
        // --- INITIALIZE WITH SAMPLE PODS ---
        createPod(-3, -2, 0xff5533, 0.7);
        createPod(2, 3, 0x44aaff, 0.8);
        createPod(0, 4, 0xffaa44, 0.6);
        createPod(4, -1, 0xaa44ff, 0.7);
        addFloatingParticles(25);
        
        updateModeDisplay();
        animate();
        
        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
